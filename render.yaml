services:
  - type: web
    name: flowise-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        value: <your-external-database-url>
      - key: OPENAI_API_KEY
        value: <your-openai-api-key>
